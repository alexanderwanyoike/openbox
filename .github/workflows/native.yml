name: Native platforms
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfftw3-dev libxkbcommon-dev libwayland-dev pkg-config ffmpeg
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows decoder
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --no-progress -y
      - name: Prepare pinned FFTW source
        shell: python
        run: |
          import hashlib, os, pathlib, tarfile, urllib.request
          destination = pathlib.Path('.native').resolve()
          destination.mkdir(exist_ok=True)
          archive = destination / 'fftw-3.3.10.tar.gz'
          urllib.request.urlretrieve('https://fftw.org/fftw-3.3.10.tar.gz', archive)
          expected = '56c932549852cddcfafdab3820b0200c7742675be92179e59e6215b340e26467'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('FFTW source checksum mismatch')
          with tarfile.open(archive) as source:
              source.extractall(destination, filter='data')
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'OPENBOX_FFTW_SOURCE={destination / "fftw-3.3.10"}\n')
      - name: Build native executable
        run: cargo build --locked --target ${{ matrix.target }} --no-default-features --features desktop
      - name: Test native code
        run: cargo test --locked --workspace --all-targets --target ${{ matrix.target }} --no-default-features --features desktop
      - name: Exercise analysis with Finder's restricted PATH
        if: runner.os == 'macOS'
        shell: bash
        run: |
          analysis_test=$(cargo test --locked -p openbox-analysis --target ${{ matrix.target }} --no-run --message-format=json | python3 -c 'import json,sys; artifacts=[json.loads(line) for line in sys.stdin]; print(next(item["executable"] for item in artifacts if item.get("reason")=="compiler-artifact" and item["target"]["name"]=="openbox_analysis" and item["profile"]["test"] and item.get("executable")))')
          PATH=/usr/bin:/bin "$analysis_test" --exact tests::detects_tempo_key_and_beats_from_audio_without_tags
      - name: Exercise executable startup
        shell: bash
        run: |
          target/${{ matrix.target }}/debug/openbox --version
          target/${{ matrix.target }}/debug/openbox --help
