name: Native platforms
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, feature/native-platforms]
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfftw3-dev libxkbcommon-dev libwayland-dev pkg-config ffmpeg
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install fftw ffmpeg
      - name: Windows decoder
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --no-progress -y
      - name: Build native executable
        run: cargo build --locked --target ${{ matrix.target }} --no-default-features --features desktop
      - name: Test native code
        run: cargo test --locked --workspace --all-targets --target ${{ matrix.target }} --no-default-features --features desktop
      - name: Exercise executable startup
        shell: bash
        run: |
          target/${{ matrix.target }}/debug/openbox --version
          target/${{ matrix.target }}/debug/openbox --help
